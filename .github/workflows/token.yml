name: Токен Instagram — проверить и продлить

# Долгоживущий токен Instagram действует около 60 дней. Meta при продлении выдаёт НОВЫЙ токен,
# поэтому workflow проверяет новый токен и записывает его в секрет IG_ACCESS_TOKEN.
# Для записи нужен секрет GH_SECRETS_PAT: ключ GitHub с правом Secrets: read and write
# только на этот репозиторий (обычный токен workflow менять секреты не может).
# Продлевать можно не чаще раза в сутки. Запускается 1-го и 15-го числа каждого месяца и вручную.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1,15 * *"   # 1-го и 15-го числа, 11:00 по Алматы

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка доступа до продления
        run: python -u tools/publish_instagram.py check
      - name: Продлить токен и записать новый в секрет
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python -u tools/publish_instagram.py refresh --github-secret IG_ACCESS_TOKEN
      - name: Проверка доступа после продления
        if: always() && steps.refresh.conclusion != 'skipped'
        run: python -u tools/publish_instagram.py check
