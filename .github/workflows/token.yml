name: Токен Instagram — проверить и продлить

# Долгоживущий токен Instagram действует около 60 дней. Этот workflow продлевает его
# и проверяет, что доступ к аккаунту работает.
# Сначала запусти вручную (Run workflow). Если в журнале написано, что значение токена
# не изменилось, раскомментируй расписание ниже.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 1,15 * *"   # 1-го и 15-го числа, 11:00 по Алматы

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Продлить токен и проверить доступ
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python -u tools/publish_instagram.py refresh
          python -u tools/publish_instagram.py check
